<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>THE Protocol Base</title>

<style>
/* Mise en page : appli mobile, en-tête fixe, contenu qui défile, barre du bas en tuiles 3D. Style THE Protocol : crème, contours encre épais, ombres pleines, pastels. */
:root{
 --bg:#FBF6ED;--ink:#19163D;--soft:#6b6590;--card:#ffffff;--trk:#f1ebf7;--ol:#19163D;
 --pink:#ffd3e4;--lilac:#e7deff;--mint:#c9f2df;--sun:#fff0b8;--sky:#d9ecff;--peach:#ffe1d3;
 --accent:#ff4fa0;--gold:#FFDA43;
 --font:'Fredoka',ui-rounded,'Nunito','Segoe UI',system-ui,sans-serif;
 --gx:max(16px,env(safe-area-inset-left,0px));--gxr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f24;--ink:#f3efff;--soft:#a9a2d0;--card:#1e1938;--trk:#2a2350;--ol:#05030f;--pink:#4a2340;--lilac:#30285c;--mint:#1c3d33;--sun:#3d3418;--sky:#1d3150;--peach:#43291f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120f24;--ink:#f3efff;--soft:#a9a2d0;--card:#1e1938;--trk:#2a2350;--ol:#05030f;--pink:#4a2340;--lilac:#30285c;--mint:#1c3d33;--sun:#3d3418;--sky:#1d3150;--peach:#43291f;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
/* en-tête */
.top{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding-block:10px 8px;padding-left:var(--gx);padding-right:var(--gxr)}
.logo{display:flex;align-items:center;gap:6px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo i{width:32px;height:32px;border-radius:50%;flex:0 0 auto;background:conic-gradient(#ff4fa0,#ffb100,#ffe14d,#4fd18b,#3aa8ff,#8458e0,#ff4fa0);border:2.5px solid var(--ol);display:flex;align-items:center;justify-content:center}
.logo i::after{content:'';width:13px;height:13px;border-radius:50%;background:var(--bg);border:2.5px solid var(--ol)}
.logo span{display:flex;flex-direction:column;min-width:0;line-height:1.05}
.logo b{font-size:13px;font-weight:700;letter-spacing:0;line-height:1}
.logo small{font-size:11.5px;font-weight:600;color:#7b5cf0;letter-spacing:.3px}
.pill{height:40px;min-width:40px;flex:0 0 auto;border-radius:21px;border:2.5px solid var(--ol);background:var(--card);box-shadow:0 3px 0 var(--ol);display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:14px;padding:0 10px}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ol)}
.lvl{padding:0 10px 0 2px;transform:rotate(-3deg)}
.lvl .st{width:28px;height:28px;flex:0 0 auto}
.say .st{width:64px;height:64px;flex:0 0 auto}
.pill svg.ic{width:20px;height:20px}
/* vues */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:4px calc(118px + env(safe-area-inset-bottom,0px));padding-left:var(--gx);padding-right:var(--gxr)}
.view{display:flex;flex-direction:column;gap:14px;animation:rise .4s cubic-bezier(.2,.9,.3,1.15)}
@keyframes rise{from{opacity:.4;transform:translateY(12px)}to{opacity:1;transform:none}}
h1.date{font-size:30px;font-weight:700;margin:4px 0 0;line-height:1.1;text-wrap:balance}
h1.date::first-letter{text-transform:uppercase}
.hd{display:flex;align-items:center;gap:12px}.hd .tx{flex:1;min-width:0}
.hd h1{font-size:28px;font-weight:700;margin:0 0 4px;line-height:1.1;text-wrap:balance}.hd p{margin:0;font-size:15px;font-weight:500;color:var(--soft);line-height:1.35}
.lm{display:block;flex:0 0 auto;width:70px;height:80px}
.lm svg{width:100%;height:100%;overflow:visible;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.say{display:flex;align-items:center;gap:6px}
.bub{flex:1;min-width:0;position:relative;background:var(--card);border:2.5px solid var(--ol);box-shadow:0 4px 0 var(--ol);border-radius:22px;padding:12px 14px 10px;text-align:left}
.bub::before{content:'';position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--card);border-left:2.5px solid var(--ol);border-bottom:2.5px solid var(--ol);transform:translateY(-50%) rotate(45deg)}
.bub p{margin:0 0 8px;font-size:15.5px;font-weight:600;line-height:1.35;min-height:2.7em}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:4px;background:var(--trk);transition:width .25s}.dots i.on{width:20px;background:var(--accent)}
.tile{display:flex;align-items:center;gap:12px;border:2.5px solid var(--ol);box-shadow:0 4px 0 var(--ol);border-radius:24px;padding:14px;background:linear-gradient(120deg,var(--c1),var(--card));text-align:left;width:100%}
.tile .ti{width:50px;height:50px;border-radius:16px;border:2.5px solid var(--ol);background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
.tile .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:17px;font-weight:700;line-height:1.15}.tile small{font-size:13px;font-weight:600;color:var(--soft);line-height:1.3}
.tile em{font-style:normal;flex:0 0 auto;border:2.5px solid var(--ol);border-radius:18px;padding:7px 12px;font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;background:var(--card);box-shadow:0 3px 0 var(--ol)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.slot{border:2.5px dashed var(--ol);border-radius:24px;padding:22px 16px;text-align:center;color:var(--soft);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px;background:color-mix(in srgb,var(--card) 55%,transparent)}
.slot b{color:var(--ink);font-size:16px}
.slot code{font-size:12px;background:var(--trk);border-radius:8px;padding:2px 8px;color:var(--ink)}
.sec{font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--soft);margin:6px 2px -4px}
.card{background:var(--card);border:2.5px solid var(--ol);box-shadow:0 4px 0 var(--ol);border-radius:24px;padding:14px}
.back{align-self:flex-start;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--trk)}.row:first-child{border-top:0}.row span{flex:1;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:2.5px solid var(--ol);border-radius:14px;padding:6px 12px;font-weight:700;background:var(--card)}.seg button.on{background:var(--gold);color:#19163D}
.bar{height:14px;border:2.5px solid var(--ol);border-radius:9px;background:var(--trk);overflow:hidden}.bar u{display:block;height:100%;background:linear-gradient(90deg,#ff7ebd,#ffb100);transition:width .5s}
.big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.link{background:none;border:0;padding:6px;font-weight:700;color:var(--soft);text-decoration:underline;text-underline-offset:3px}
/* barre du bas */
.bnav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;gap:4px;padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:2.5px solid var(--ol);border-radius:22px 22px 0 0}
.bnav button{flex:1 1 0;min-width:0;max-width:86px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2.5px solid var(--ol);border-radius:18px;background:linear-gradient(170deg,var(--ns),var(--nm));box-shadow:0 3px 0 var(--ol);padding:3px 1px;color:#19163D;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.bnav svg{width:24px;height:24px}
.bnav b{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bnav button.on{transform:translateY(-5px);box-shadow:0 6px 0 var(--ol)}
.bnav button.on b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.bnav button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ol)}
.bnav [data-tab=home]{--nm:#9cc8ff;--ns:#e3efff}.bnav [data-tab=tools]{--nm:#c9b2ff;--ns:#efe8ff}.bnav [data-tab=shop]{--nm:#ffd45e;--ns:#fff4c8}.bnav [data-tab=dash]{--nm:#9fe5df;--ns:#dcf7f4}.bnav [data-tab=wheel]{--nm:#ffb199;--ns:#ffe6dc}.bnav [data-tab=prof]{--nm:#ffa9bd;--ns:#ffe1e8}
/* feuille */
.sheet{position:absolute;inset:0;z-index:40;background:rgba(20,14,40,.45);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .in{width:100%;background:var(--bg);border:2.5px solid var(--ol);border-bottom:0;border-radius:28px 28px 0 0;padding-block:16px calc(22px + env(safe-area-inset-bottom,0px));padding-left:var(--gx);padding-right:var(--gxr);transform:translateY(40px);transition:transform .3s cubic-bezier(.3,1.3,.5,1);display:flex;flex-direction:column;gap:12px}
.sheet.on .in{transform:none}
.sheet h2{margin:0;font-size:22px;display:flex;align-items:center;justify-content:space-between}
.x{width:38px;height:38px;border-radius:12px;border:2.5px solid var(--ol);background:var(--card);font-weight:700}
.toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,20px);background:#1c1640;color:#fff;border:2.5px solid var(--ol);border-radius:18px;padding:10px 16px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.marm,.mcrown{transform-box:fill-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app">
 <header class="top">
  <button class="logo" type="button" data-a="tab" data-v="home" aria-label="THE PROTOCOL"><i aria-hidden="true"></i><span><b>THE PROTOCOL</b><small>Unlock You</small></span></button>
  <button class="pill lvl" type="button" id="lvlbtn" data-a="level"></button>
  <button class="pill" type="button" id="langbtn" data-a="lang"></button>
  <button class="pill" type="button" id="themebtn" data-a="theme"></button>
 </header>
 <main id="main"></main>
 <nav class="bnav" id="bnav"></nav>
 <div class="sheet" id="sheet"><div class="in" id="sheetin" role="dialog" aria-modal="true"></div></div>
 <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
var K='#1c1640';
function spk(x,y,s){return '<path class="lspk" d="M'+x+' '+(y-3*s)+'l'+(.9*s)+' '+(2.1*s)+' '+(2.1*s)+' '+(.9*s)+'-'+(2.1*s)+' '+(.9*s)+'-'+(.9*s)+' '+(2.1*s)+'-'+(.9*s)+'-'+(2.1*s)+'-'+(2.1*s)+'-'+(.9*s)+' '+(2.1*s)+'-'+(.9*s)+'z" fill="#ffd23d" stroke="'+K+'" stroke-width=".8"/>'}
var MOUTH=/<path d="M27 51\.5q5 6 10 0z"[^>]*\/>/,TONGUE=/<path d="M29\.5 54\.3[^>]*\/>/,EYES=/<g class="eyes">.*?<\/g>/;

function mascot(i){var K='#1c1640';return '<svg viewBox="0 0 64 74"><defs>'+
 '<radialGradient id="mb'+i+'" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#fff2f9"/><stop offset=".35" stop-color="#ffb8dc"/><stop offset=".75" stop-color="#ff7ebd"/><stop offset="1" stop-color="#f2569f"/></radialGradient>'+
 '<linearGradient id="mg'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffb100"/></linearGradient></defs>'+
 '<ellipse cx="32" cy="70.5" rx="16" ry="2.6" fill="rgba(28,22,64,.18)"/>'+
 '<g class="marm l"><path d="M12 46q-6 2-7 8" stroke="'+K+'" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M12 46q-6 2-7 8" stroke="#ff8cc6" stroke-width="4.4" stroke-linecap="round" fill="none"/></g>'+
 '<g class="marm r"><path d="M52 46q6-2 8-8" stroke="'+K+'" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M52 46q6-2 8-8" stroke="#f56aae" stroke-width="4.4" stroke-linecap="round" fill="none"/></g>'+
 '<path d="M32 21c13.6 0 23 9.4 23 23 0 13-9.6 22-23 22S9 57 9 44c0-13.6 9.4-23 23-23z" fill="url(#mb'+i+')" stroke="'+K+'" stroke-width="2.4"/>'+
 '<ellipse cx="21" cy="30" rx="6" ry="3.2" fill="#fff" opacity=".6" transform="rotate(-30 21 30)"/>'+

 '<path class="mtw" d="M51 4l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z" fill="#ffd23d" stroke="'+K+'" stroke-width=".8"/></g>'+
 '<g class="eyes"><ellipse cx="25" cy="43" rx="5" ry="6.2" fill="#fff" stroke="'+K+'" stroke-width="1.8"/><ellipse cx="39" cy="43" rx="5" ry="6.2" fill="#fff" stroke="'+K+'" stroke-width="1.8"/>'+
 '<circle cx="25.8" cy="44.4" r="3.2" fill="'+K+'"/><circle cx="39.8" cy="44.4" r="3.2" fill="'+K+'"/><circle cx="24.6" cy="42.8" r="1.3" fill="#fff"/><circle cx="38.6" cy="42.8" r="1.3" fill="#fff"/></g>'+
 '<ellipse cx="18" cy="51" rx="3.8" ry="2.3" fill="#ff3d84" opacity=".5"/><ellipse cx="46" cy="51" rx="3.8" ry="2.3" fill="#ff3d84" opacity=".5"/>'+
 '<path d="M27 51.5q5 6 10 0z" fill="#3b1446" stroke="'+K+'" stroke-width="1.8" stroke-linejoin="round"/><path d="M29.5 54.3q2.5 1.5 5 0q-2.5-1.3-5 0z" fill="#ff7aa5"/></svg>'}

function mascotZen(i){var K='#1c1640',m=mascot(i);
 m=m.replace(/<g class="marm l">.*?<\/g>/,'').replace(/<g class="marm r">.*?<\/g>/,'');
 m=m.replace(/<g class="eyes">.*?<\/g>/,'<path d="M19.5 42.5q5.5 5.5 11 0M33.5 42.5q5.5 5.5 11 0" stroke="'+K+'" stroke-width="2.6" stroke-linecap="round" fill="none"/>');
 m=m.replace(/<path d="M27 51\.5q5 6 10 0z"[^>]*\/>/,'<path d="M28 51.5q4 4 8 0" stroke="'+K+'" stroke-width="2.2" stroke-linecap="round" fill="none"/>').replace(/<path d="M29\.5 54\.3[^>]*\/>/,'');
 var extra='<path d="M12 48q-6 6-3 13" stroke="'+K+'" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M12 48q-6 6-3 13" stroke="#ff8cc6" stroke-width="4.4" stroke-linecap="round" fill="none"/>'+
 '<path d="M52 48q6 6 3 13" stroke="'+K+'" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M52 48q6 6 3 13" stroke="#f56aae" stroke-width="4.4" stroke-linecap="round" fill="none"/>'+
 '<path d="M10 63q22 9 44 0" stroke="'+K+'" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M10 63q22 9 44 0" stroke="#f56aae" stroke-width="5" stroke-linecap="round" fill="none"/>'+
 '<ellipse cx="24" cy="66.5" rx="8" ry="3.8" fill="#ff8cc6" stroke="'+K+'" stroke-width="1.8"/><ellipse cx="40" cy="66.5" rx="8" ry="3.8" fill="#ff8cc6" stroke="'+K+'" stroke-width="1.8"/>'+
 '<circle cx="9.5" cy="61.5" r="3.6" fill="#ff8cc6" stroke="'+K+'" stroke-width="1.8"/><circle cx="54.5" cy="61.5" r="3.6" fill="#f56aae" stroke="'+K+'" stroke-width="1.8"/>';
 return m.replace('</svg>',extra+'</svg>')}

function lumiSVG(st,id){var m;if(st==='calm')return mascotZen(id);m=mascot(id);
  if(st==='celebrating'||st==='encouraging'){m=m.replace(MOUTH,'<path d="M25.5 50.5q6.5 10.5 13 0z" fill="#3b1446" stroke="'+K+'" stroke-width="1.8" stroke-linejoin="round"/><path d="M29 55.8q3 2.4 6 0q-3-1.9-6 0z" fill="#ff7aa5"/>').replace(TONGUE,'')}
  if(st==='celebrating'){m=m.replace(EYES,'<path d="M20 45q5-7 10 0M34 45q5-7 10 0" stroke="'+K+'" stroke-width="2.8" stroke-linecap="round" fill="none"/>').replace(/M12 46q-6 2-7 8/g,'M12 44q-7-4-7-12').replace(/M52 46q6-2 8-8/g,'M52 44q7-4 7-12');m=m.replace('</svg>',spk(5,24,1.6)+spk(60,26,1.3)+spk(57,58,1)+'</svg>')}
  if(st==='encouraging')m=m.replace('</svg>',spk(58,24,1.2)+'</svg>');
  if(st==='sleeping'){m=m.replace(EYES,'<path d="M20 43q5 4.5 10 0M34 43q5 4.5 10 0" stroke="'+K+'" stroke-width="2.6" stroke-linecap="round" fill="none"/>').replace(MOUTH,'<ellipse cx="32" cy="53.5" rx="2.3" ry="2.7" fill="#3b1446" stroke="'+K+'" stroke-width="1.4"/>').replace(TONGUE,'');
    m=m.replace(/<g class="marm l">.*?<\/g>/,'').replace(/<g class="marm r">.*?<\/g>/,'');m=m.replace('</svg>','<text class="lz" x="50" y="24" font-size="9" font-weight="700" fill="#6b7cff" font-family="Fredoka,sans-serif">z</text><text class="lz b" x="55" y="15" font-size="12" font-weight="700" fill="#6b7cff" font-family="Fredoka,sans-serif">Z</text></svg>')}
  if(st==='focused'){m=m.replace(EYES,'<g class="eyes"><ellipse cx="25" cy="44" rx="5" ry="4.6" fill="#fff" stroke="'+K+'" stroke-width="1.8"/><ellipse cx="39" cy="44" rx="5" ry="4.6" fill="#fff" stroke="'+K+'" stroke-width="1.8"/><circle cx="25.8" cy="44.8" r="3" fill="'+K+'"/><circle cx="39.8" cy="44.8" r="3" fill="'+K+'"/></g><path d="M19.5 38l10 1.5M44.5 38l-10 1.5" stroke="'+K+'" stroke-width="2.4" stroke-linecap="round"/>').replace(MOUTH,'<path d="M28.5 53.5h7" stroke="'+K+'" stroke-width="2.4" stroke-linecap="round"/>').replace(TONGUE,'');
    m=m.replace('<g class="mcrown">','<path d="M10.5 33q21.5-8 43 0" stroke="'+K+'" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M10.5 33q21.5-8 43 0" stroke="#3a7bff" stroke-width="3.4" fill="none" stroke-linecap="round"/><g class="mcrown">')}
  if(st==='thinking'){m=m.replace(/<circle cx="25\.8" cy="44\.4" r="3\.2"/,'<circle cx="27" cy="42" r="3.2"').replace(/<circle cx="39\.8" cy="44\.4" r="3\.2"/,'<circle cx="41" cy="42" r="3.2"').replace(MOUTH,'<path d="M28.5 54q3.5 1.6 7-.8" stroke="'+K+'" stroke-width="2.3" stroke-linecap="round" fill="none"/>').replace(TONGUE,'');
    m=m.replace('</svg>','<circle class="lth" cx="53" cy="22" r="1.9" fill="#fff" stroke="'+K+'" stroke-width="1.2"/><circle class="lth b" cx="57.5" cy="15" r="2.6" fill="#fff" stroke="'+K+'" stroke-width="1.2"/><circle class="lth c" cx="61" cy="7" r="3.4" fill="#fff" stroke="'+K+'" stroke-width="1.2"/></svg>')}
  return m}

/* ================= THE PROTOCOL — BASE =================
   Structure vide à remplir :
   - TXT     : tous les textes FR / EN / HU
   - TABS    : les onglets du bas (ordre, icône, page)

/* --- dates (locales) --- */
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2]||1)}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}
function mn(x){var a=String(x).split(':');return (+a[0])*60+(+a[1]||0)}
function hm(m){return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
function today(){return ymd(new Date())}
function nowHM(){var n=new Date();return hm(n.getHours()*60+n.getMinutes())}
function fmtD(s,o){return pd(s).toLocaleDateString(LOC[S.lang],o||{weekday:'short',day:'numeric',month:'short'})}
function mName(ym,o){return pd(ym+'-01').toLocaleDateString(LOC[S.lang],o||{month:'long'})}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cmp(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1}

/* --- données --- */
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function log(m,a,x){(m.hist=m.hist||[]).push({t:new Date().toISOString(),a:a,x:x||''})}
function newM(o){var m={id:uid('m'),title:o.title,zone:o.zone||'todo',lvl:o.lvl||'standard',vars:o.vars||null,date:o.date,time:o.time,dur:+o.dur||15,status:'planned',check:null,path:o.path||null,src:o.src||'',hist:[]};log(m,'created');return m}

function store(){if(U.view==='trial')return U.tstore;if(U.mode==='demo'){if(!U.demo)U.demo=makeDemo();return U.demo}return U.draft}

function clashes(st,date,time,dur,except){var a=mn(time),b=a+(+dur||0),r=[];
 st.missions.forEach(function(m){if(m.id===except||m.status==='archived'||m.date!==date)return;var x=mn(m.time),y=x+(+m.dur||0);if(a<y&&x<b)r.push(m.title)});

function suggest(st,dur,except){var r=[],nm=mn(nowHM()),t0=today(),T=['07:30','12:30','18:30','20:00'];
 for(var i=0;i<21&&r.length<2;i++){var d=addD(t0,i);for(var j=0;j<T.length&&r.length<2;j++){if(i===0&&mn(T[j])<nm+30)continue;if(r.length&&r[0].date===d)continue;if(!clashes(st,d,T[j],dur,except).length)r.push({date:d,time:T[j]})}}return r}

var AC=null,WL=null;
function ac(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,dur,type,vol){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05)}
function ring(){var s=P.set.sound;if(s==='off')return;
 if(s==='bell')[0,.6,1.2].forEach(function(t){tone(880,t,1.2,'sine',.35);tone(1320,t,.8,'sine',.12)});
 else if(s==='soft')[523,659,784,1046].forEach(function(f,i){tone(f,i*.22,.9,'triangle',.25)});
 else [0,.25,.5,.75,1.2,1.45,1.7,1.95].forEach(function(t){tone(1000,t,.12,'square',.12)})}

function notify(title,body){if(!P.set.notif||!('Notification' in window))return;try{if(Notification.permission==='granted')new Notification(title,{body:body})}catch(e){}}
function alarm(title,body){ring();buzz();notify(title,body||'');toast(title)}
function wake(on){try{if(on&&P.set.wake&&navigator.wakeLock&&!WL)navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener&&l.addEventListener('release',function(){WL=null})}).catch(function(){});if(!on&&WL){WL.release();WL=null}}catch(e){}}

ion, lasting faintness), <b>call a doctor, 144 (Switzerland) or 112</b>.</div><button type=\"button\" class=\"fzgo\" style=\"width:100%;background:#FF5C6C\" data-a=\"fzend\">■ Stop my fast</button><button type=\"button\" class=\"sbtn\" data-a=\"close\">Close</button>", "<p>Ton énergie compte plus que le chrono. 💛<br>Tu veux faire le point sur ce que tu ressens ?</p></div><div class=\"fzbtns\"><button type=\"button\" data-a=\"fzgo\" data-v=\"tips\">Oui, des conseils</button><button type=\"button\" class=\"end\" data-a=\"fzend\">Arrêter mon jeûne</button></div>": "<p>Your energy matters more than the stopwatch. 💛<br>Want to take stock of how you feel?</p></div><div class=\"fzbtns\"><button type=\"button\" data-a=\"fzgo\" data-v=\"tips\">Yes, some tips</button><button type=\"button\" class=\"end\" data-a=\"fzend\">Stop my fast</button></div>", "Ressenti noté ✓": "Feeling noted ✓", "🏁 Fin de mon jeûne": "🏁 End of my fast", "Tu as écouté ton corps, et c'est important. 💛": "You listened to your body, and that matters. 💛", "Bravo, tu as suivi ton plan ! 🌟": "Well done, you followed your plan! 🌟", "</p></div><div class=\"fztimes\"><div><small>Durée réelle</small><b>": "</p></div><div class=\"fztimes\"><div><small>Actual duration</small><b>", "</b></div><div><small>Objectif</small><b>": "</b></div><div><small>Goal</small><b>", "<div class=\"fzlab\">Ressenti</div><div class=\"fzfeel\">": "<div class=\"fzlab\">Feeling</div><div class=\"fzfeel\">", "<label class=\"wfl\">Notes<input id=\"fzen\" class=\"wfld\" maxlength=\"160\" value=\"": "<label class=\"wfl\">Notes<input id=\"fzen\" class=\"wfld\" maxlength=\"160\" value=\"", "<div class=\"fzbox\" style=\"background:#c9f2df;color:#19163D\">🥗 Pour rompre : un vrai repas, avec protéines, légumes et bons glucides. Mange lentement.</div>": "<div class=\"fzbox\" style=\"background:#c9f2df;color:#19163D\">🥗 To break your fast: a real meal, with protein, vegetables and good carbs. Eat slowly.</div>", "<button type=\"button\" class=\"wbtn\" data-a=\"fzendok\">Enregistrer ma session</button><button type=\"button\" class=\"link\" data-a=\"fzendno\">Terminer sans enregistrer</button>": "<button type=\"button\" class=\"wbtn\" data-a=\"fzendok\">Save my session</button><button type=\"button\" class=\"link\" data-a=\"fzendno\">Finish without saving</button>", "🗒️ Revue de la semaine": "🗒️ Weekly review", "<div class=\"bub\"><p style=\"min-height:0\">3 petites questions, pas de bonne ou mauvaise réponse. ✍️</p></div></div><label class=\"wfl\">1. Qu'as-tu appris ?<input id=\"fzr1\" class=\"wfld\" maxlength=\"120\" value=\"": "<div class=\"bub\"><p style=\"min-height:0\">3 small questions, no right or wrong answer. ✍️</p></div></div><label class=\"wfl\">1. What did you learn?<input id=\"fzr1\" class=\"wfld\" maxlength=\"120\" value=\"", "\"></label><label class=\"wfl\">2. Comment t'es-tu senti ?<input id=\"fzr2\" class=\"wfld\" maxlength=\"120\" value=\"": "\"></label><label class=\"wfl\">2. How did you feel?<input id=\"fzr2\" class=\"wfld\" maxlength=\"120\" value=\"", "\"></label><label class=\"wfl\">3. Qu'aimerais-tu ajuster ?<input id=\"fzr3\" class=\"wfld\" maxlength=\"120\" value=\"": "\"></label><label class=\"wfl\">3. What would you like to adjust?<input id=\"fzr3\" class=\"wfld\" maxlength=\"120\" value=\"", "\"></label><button type=\"button\" class=\"wbtn\" data-a=\"fzrevok\">Enregistrer</button>": "\"></label><button type=\"button\" class=\"wbtn\" data-a=\"fzrevok\">Save</button>", "<div class=\"fzbox\" style=\"background:#fff0b8;color:#19163D\">🎯 <b>Action :</b> ": "<div class=\"fzbox\" style=\"background:#fff0b8;color:#19163D\">🎯 <b>Action:</b> ", "Ta sécurité passe avant tout. Tu peux toujours arrêter. 💛": "Your safety comes first. You can always stop. 💛", "Essaie juste celle-là aujourd'hui, on verra demain ! ✨": "Just try this one today, we'll see tomorrow! ✨", "⭐ Favori": "⭐ Favourite", "☆ Favori": "☆ Favourite", "</button><button type=\"button\" class=\"ci\" data-a=\"close\">OK</button></div>": "</button><button type=\"button\" class=\"ci\" data-a=\"close\">OK</button></div>", "🛡️ Sécurité & limites": "🛡️ Safety & limits", "<div class=\"fzsafe red\"><b>Pas de jeûne</b> si tu as moins de 18 ans, si tu es enceinte ou allaites, ou si tu as des antécédents de troubles alimentaires.</div><div class=\"fzsafe\"><b>Avis médical avant</b> si tu as un diabète, des médicaments à risque d'hypoglycémie, une maladie chronique ou un poids bas.</div><div class=\"fzrow\"><span class=\"e\">🛑</span><span><b>Arrête et mange</b> en cas de malaise, vertiges importants, confusion ou faiblesse marquée. Si ça dure : 144 (Suisse) ou 112.</span></div><div class=\"fzrow\"><span class=\"e\">💧</span><span><b>Jamais de jeûne sec</b> : continue de boire.</span></div><div class=\"fzrow\"><span class=\"e\">🚫</span><span><b>Le jeûne n'est pas un traitement.</b> Aucune perte de poids n'est promise.</span></div><p class=\"fznote\">Informations générales, pas un avis médical personnel.</p><button type=\"button\" class=\"wbtn\" data-a=\"close\">Compris</button>": "<div class=\"fzsafe red\"><b>No fasting</b> if you're under 18, pregnant or breastfeeding, or have a history of eating disorders.</div><div class=\"fzsafe\"><b>Medical advice first</b> if you have diabetes, medication with a risk of hypoglycaemia, a chronic illness or low weight.</div><div class=\"fzrow\"><span class=\"e\">🛑</span><span><b>Stop and eat</b> if you feel unwell, very dizzy, confused or markedly weak. If it lasts: 144 (Switzerland) or 112.</span></div><div class=\"fzrow\"><span class=\"e\">💧</span><span><b>Never dry fast</b>: keep drinking.</span></div><div class=\"fzrow\"><span class=\"e\">🚫</span><span><b>Fasting is not a treatment.</b> No weight loss is promised.</span></div><p class=\"fznote\">General information, not personal medical advice.</p><button type=\"button\" class=\"wbtn\" data-a=\"close\">Got it</button>", "Merci 💛 Le suivi est ouvert": "Thank you 💛 Tracking is now open", "⚙️ Réglages Fasting": "⚙️ F ACT.fzdoc=function(){F.doc=true;save();render();toast(T('Merci 💛 Le suivi est ouvert'))};
ACT.fzset=function(){sheet(shx(T('⚙️ Réglages Fasting'))+T('<div class="fzopt"><button type="button" data-a="fzhabits">🕐 Mes horaires habituels · ')+F.last+' → '+F.first+T('</button><button type="button" data-a="fzonb">🔁 Refaire mes questions (et la sécurité)</button><button type="button" data-a="fzreintro">👋 Revoir l\'intro de Lumi</button><button type="button" data-a="fzexport">📋 Copier mes données</button><button type="button" data-a="fzwipe" style="color:#FF5C6C">🗑️ Supprimer mes données Fasting</button></div><p class="fznote">🔒 Tes données restent sur cet appareil. Rappels : utilise les Smart reminders du Pomodoro (bientôt ici).</p>'))};
ACT.fzonb=function(){restartOnb()};ACT.fzreintro=function(){IS=0;OQ=-1;OA={};introSheet()};
ACT.fzexport=function(){var txt=JSON.stringify(F,null,1);try{navigator.clipboard.writeText(txt).then(function(){toast(T('Données copiées 📋'))},function(){toast(T('Copie impossible ici'))})}catch(e){toast(T('Copie impossible ici'))}};
ACT.fzwipe=function(){sheet(shx(T('🗑️ Supprimer mes données'))+T('<p style="margin:0;font-weight:600">Sessions, réponses, favoris et progression Fasting seront effacés de cet appareil.</p><div class="seg"><button type="button" data-a="close">Garder</button><button type="button" data-a="fzwipeok" style="background:#ffe1e1;color:#a01828">Supprimer</button></div>'))};
ACT.fzwipeok=function(){for(var k in F)delete F[k];F.intro=false;F.day={};F.onb={};F.grp=0;F.doc=false;F.plan='14';F.first='10:00';F.last='20:00';F.act=null;F.hist=[];F.pts=0;F.xp={};F.fav={};F.read={};F.rev={};F.bd={};F.lastEnd=null;try{localStorage.removeItem(FK)}catch(e){}V.v='home';V.introShown=false;shClose();render();toast(T('Données supprimées'))};
var oCl=ACT.close;ACT.close=function(){CI=null;END=null;oCl()};
var oDo=ACT.doreset;ACT.doreset=function(){try{localStorage.removeItem(FK)}catch(e){}oDo()};

/* chrono : mise à jour chaque seconde, calculée depuis la date de début */
setInterval(function(){if(S.sub!=='fasting'&&S.sub!=='fast')return;var a=F.act;if(!a||V.v!=='timer')return;var el=now()-a.start,goal=a.goal*36e5,e1=document.getElementById('fzel');if(!e1)return;
 if(el>=goal&&!V.goalShown){V.goalShown=true;render();return}
 e1.textContent=dur(el);var r=document.getElementById('fzrem');if(r)r.textContent=el>=goal?'+ '+dur(el-goal)+T(' au-delà'):T('reste ')+dur(goal-el);var pc=document.getElementById('fzpct');if(pc)pc.textContent=Math.min(100,Math.floor(el/goal*100))+' %';var arc=document.getElementById('fzarc');if(arc)arc.setAttribute('stroke-dasharray',(C*Math.min(1,el/goal)).toFixed(1)+' '+C.toFixed(1))},1000);

/* tuile dans Outils */
var oTools=PAGES.tools;PAGES.tools=function(){ens();var h=oTools(),a=F.act;var tile='<button type="button" class="tile" style="--c1:var(--peach);--c2:#FFDA43" data-a="sub" data-v="fasting"><span class="ti">⏳</span><span class="tx"><b>Fasting</b><small>'+(a?T('Jeûne en cours · ')+dur(now()-a.start):T('Jeûne intermittent · apprendre, suivre, ajuster'))+'</small></span><em>'+t('open')+' ›</em></button>';var i=h.indexOf('<div class="slot">');return i<0?h+tile:h.slice(0,i)+tile+h.slice(i)};
var oSub=ACT.sub;ACT.sub=function(v){if(v==='fasting'||v==='fast'){V.v='home';V.tab='simple'}oSub(v)};
PROTO.FAST=F;
PROTO.fastDur=dur;
render();
})();
